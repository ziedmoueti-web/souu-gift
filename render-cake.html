<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a01e2f" />
          <stop offset="55%" stop-color="#7c1220" />
          <stop offset="100%" stop-color="#570b13" />
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
          <stop offset="0%" stop-color="rgba(255,180,150,0.16)" />
          <stop offset="100%" stop-color="rgba(255,180,150,0)" />
        </radialGradient>
        <radialGradient id="flameGrad" cx="0.5" cy="0.65" r="0.75">
          <stop offset="0%" stop-color="#fff6dd" />
          <stop offset="60%" stop-color="#ffdf9e" />
          <stop offset="100%" stop-color="#ffc46a" />
        </radialGradient>
      </defs>

      <!-- red backdrop -->
      <rect width="1200" height="630" fill="url(#bgGrad)" />
      <rect width="1200" height="630" fill="url(#glow)" />

      <!-- gold frame -->
      <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="rgba(233,201,160,0.45)" stroke-width="2" />

      <!-- drifting dust -->
      <g fill="#e9c9a0">
        <circle cx="120" cy="120" r="2.5" opacity="0.3" />
        <circle cx="210" cy="420" r="2" opacity="0.2" />
        <circle cx="330" cy="200" r="2.5" opacity="0.25" />
        <circle cx="905" cy="150" r="2.5" opacity="0.3" />
        <circle cx="1030" cy="360" r="2" opacity="0.22" />
        <circle cx="960" cy="500" r="2.5" opacity="0.28" />
        <circle cx="160" cy="540" r="2" opacity="0.2" />
        <circle cx="1080" cy="110" r="2" opacity="0.25" />
        <circle cx="70" cy="330" r="2" opacity="0.18" />
        <circle cx="1130" cy="250" r="2" opacity="0.2" />
      </g>

      <!-- sparkles -->
      <g fill="#e9c9a0">
        <path d="M285 145 l4.5 -4.5 4.5 4.5 -4.5 4.5 Z" transform="rotate(45 289.5 144.5)" opacity="0.75" />
        <path d="M905 95 l4.5 -4.5 4.5 4.5 -4.5 4.5 Z" transform="rotate(45 909.5 94.5)" opacity="0.6" />
        <path d="M255 480 l4.5 -4.5 4.5 4.5 -4.5 4.5 Z" transform="rotate(45 259.5 479.5)" opacity="0.55" />
        <path d="M950 430 l4.5 -4.5 4.5 4.5 -4.5 4.5 Z" transform="rotate(45 954.5 429.5)" opacity="0.7" />
        <path d="M545 105 l4.5 -4.5 4.5 4.5 -4.5 4.5 Z" transform="rotate(45 549.5 104.5)" opacity="0.65" />
        <path d="M665 120 l4.5 -4.5 4.5 4.5 -4.5 4.5 Z" transform="rotate(45 669.5 119.5)" opacity="0.5" />
      </g>

      <!-- plate shadow + plate -->
      <ellipse cx="600" cy="486" rx="262" ry="26" fill="rgba(30,3,8,0.35)" />
      <ellipse cx="600" cy="478" rx="236" ry="22" fill="#f6ead9" />
      <ellipse cx="600" cy="478" rx="236" ry="22" fill="none" stroke="#d9b98a" stroke-width="2.5" />

      <!-- ── bottom tier ── -->
      <rect x="400" y="360" width="400" height="110" rx="14" fill="#f9efdd" />
      <!-- raspberry drip band -->
      <g fill="#d96c7d">
        <rect x="400" y="360" width="400" height="14" />
        <rect x="418" y="360" width="14" height="40" rx="7" />
        <rect x="468" y="360" width="14" height="24" rx="7" />
        <rect x="522" y="360" width="14" height="48" rx="7" />
        <rect x="582" y="360" width="14" height="26" rx="7" />
        <rect x="642" y="360" width="14" height="44" rx="7" />
        <rect x="702" y="360" width="14" height="22" rx="7" />
        <rect x="756" y="360" width="14" height="38" rx="7" />
      </g>
      <!-- hearts -->
      <g fill="#c94f63">
        <path d="M0 2.2 C0 0.8 -1.1 0 -2.2 0 C-3.6 0 -4.4 1.2 -4.4 2.4 C-4.4 4.4 -1.8 6 0 7.6 C1.8 6 4.4 4.4 4.4 2.4 C4.4 1.2 3.6 0 2.2 0 C1.1 0 0 0.8 0 2.2 Z" transform="translate(505 408) scale(1.7)" />
        <path d="M0 2.2 C0 0.8 -1.1 0 -2.2 0 C-3.6 0 -4.4 1.2 -4.4 2.4 C-4.4 4.4 -1.8 6 0 7.6 C1.8 6 4.4 4.4 4.4 2.4 C4.4 1.2 3.6 0 2.2 0 C1.1 0 0 0.8 0 2.2 Z" transform="translate(695 422) scale(1.4)" />
      </g>
      <!-- gold dots along the base -->
      <g fill="#d9b98a">
        <circle cx="430" cy="456" r="3" />
        <circle cx="465" cy="456" r="3" />
        <circle cx="500" cy="456" r="3" />
        <circle cx="535" cy="456" r="3" />
        <circle cx="570" cy="456" r="3" />
        <circle cx="630" cy="456" r="3" />
        <circle cx="665" cy="456" r="3" />
        <circle cx="700" cy="456" r="3" />
        <circle cx="735" cy="456" r="3" />
        <circle cx="770" cy="456" r="3" />
      </g>

      <!-- ── top tier ── -->
      <rect x="470" y="255" width="260" height="105" rx="12" fill="#f9efdd" />
      <g fill="#d96c7d">
        <rect x="470" y="255" width="260" height="12" />
        <rect x="486" y="255" width="12" height="30" rx="6" />
        <rect x="534" y="255" width="12" height="44" rx="6" />
        <rect x="588" y="255" width="12" height="22" rx="6" />
        <rect x="640" y="255" width="12" height="38" rx="6" />
        <rect x="692" y="255" width="12" height="26" rx="6" />
      </g>
      <path d="M0 2.2 C0 0.8 -1.1 0 -2.2 0 C-3.6 0 -4.4 1.2 -4.4 2.4 C-4.4 4.4 -1.8 6 0 7.6 C1.8 6 4.4 4.4 4.4 2.4 C4.4 1.2 3.6 0 2.2 0 C1.1 0 0 0.8 0 2.2 Z" transform="translate(600 330) scale(1.6)" fill="#c94f63" />

      <!-- ── candles ── -->
      <g>
        <!-- candle 1 -->
        <g transform="translate(545 0)">
          <rect x="-6" y="210" width="12" height="46" rx="4" fill="#fdf6e9" />
          <line x1="-6" y1="222" x2="6" y2="222" stroke="#d9b98a" stroke-width="2.5" />
          <line x1="-6" y1="236" x2="6" y2="236" stroke="#d9b98a" stroke-width="2.5" />
          <line x1="0" y1="203" x2="0" y2="210" stroke="#7a5a3a" stroke-width="2" />
          <circle cx="0" cy="196" r="11" fill="rgba(255,205,130,0.30)" />
          <path d="M0 -16 C4 -10 6 -6 6 -2 C6 3 3 6 0 6 C-3 6 -6 3 -6 -2 C-6 -6 -4 -10 0 -16 Z" transform="translate(0 198)" fill="url(#flameGrad)" />
        </g>
        <!-- candle 2 -->
        <g transform="translate(600 0)">
          <rect x="-6" y="210" width="12" height="46" rx="4" fill="#fdf6e9" />
          <line x1="-6" y1="222" x2="6" y2="222" stroke="#d9b98a" stroke-width="2.5" />
          <line x1="-6" y1="236" x2="6" y2="236" stroke="#d9b98a" stroke-width="2.5" />
          <line x1="0" y1="203" x2="0" y2="210" stroke="#7a5a3a" stroke-width="2" />
          <circle cx="0" cy="196" r="11" fill="rgba(255,205,130,0.30)" />
          <path d="M0 -16 C4 -10 6 -6 6 -2 C6 3 3 6 0 6 C-3 6 -6 3 -6 -2 C-6 -6 -4 -10 0 -16 Z" transform="translate(0 198)" fill="url(#flameGrad)" />
        </g>
        <!-- candle 3 -->
        <g transform="translate(655 0)">
          <rect x="-6" y="210" width="12" height="46" rx="4" fill="#fdf6e9" />
          <line x1="-6" y1="222" x2="6" y2="222" stroke="#d9b98a" stroke-width="2.5" />
          <line x1="-6" y1="236" x2="6" y2="236" stroke="#d9b98a" stroke-width="2.5" />
          <line x1="0" y1="203" x2="0" y2="210" stroke="#7a5a3a" stroke-width="2" />
          <circle cx="0" cy="196" r="11" fill="rgba(255,205,130,0.30)" />
          <path d="M0 -16 C4 -10 6 -6 6 -2 C6 3 3 6 0 6 C-3 6 -6 3 -6 -2 C-6 -6 -4 -10 0 -16 Z" transform="translate(0 198)" fill="url(#flameGrad)" />
        </g>
      </g>

      <!-- script -->
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap');
      </style>
      <text x="600" y="580" text-anchor="middle" font-family="'Great Vibes', cursive" font-size="62" fill="#eed9b8">happy birthday</text>
    </svg>
  </body>
</html>
